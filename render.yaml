# Render blueprint for the Class Portal.
#
# Two things about this app decide the shape of everything here. It keeps files
# on disk — student work, teacher voice notes, post attachments, nightly
# database dumps — so it needs a real disk rather than a container filesystem
# that is thrown away on every deploy. And it runs its own scheduled work
# in-process: deadline reminders, the Zoom sweep, the backup. That rules out
# anything serverless and means exactly one instance, always on.
#
# Secrets are marked `sync: false`, which means Render asks for them in the
# dashboard rather than reading them from this file. Nothing secret is committed.

services:
  - type: web
    name: gg-class-portal
    runtime: docker
    # Frankfurt is Render's closest region to Ireland.
    region: frankfurt
    plan: starter
    healthCheckPath: /api/health
    # A service with a disk runs as a single instance, which is what the cron
    # jobs need anyway — two instances would send every reminder twice.
    numInstances: 1
    disk:
      name: portal-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gg-class-portal-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # Students receive this address in their invitation email, and the
      # certificate is issued for it, so the two must name the same host.
      - key: APP_URL
        value: https://hub.gaeilgeoirguides.com
      - key: APP_DOMAIN
        value: hub.gaeilgeoirguides.com
      - key: DEFAULT_TIMEZONE
        value: Europe/Dublin

      # The first administrator, created at boot only while the portal has none.
      # Neither of these is secret; the password is generated on the server and
      # printed once to the deploy log, so it is never typed into a dashboard or
      # committed anywhere.
      - key: ADMIN_NAME
        value: Eamon Corcoran
      - key: ADMIN_EMAIL
        value: eamon@gaeilgeoirguides.com

      # 64 hex characters. Render's own generator produces base64, which the
      # preflight refuses, so this is set by hand: npm run generate-key
      - key: APP_ENCRYPTION_KEY
        sync: false

      # Everything written by the app lives on the disk above. Student work is
      # deliberately kept out of the public uploads directory — the preflight
      # refuses to start if these two ever name the same place.
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PRIVATE_UPLOAD_DIR
        value: /var/data/uploads-private
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_ENABLED
        value: "true"
      - key: BACKUP_KEEP_DAYS
        value: "14"

      # The nightly backup, emailed. Uses the mail that is already configured
      # above, so it needs no account that does not already exist. Small files
      # for now; if they outgrow email the message says so rather than quietly
      # truncating.
      - key: BACKUP_EMAIL_TO
        value: eamon@gaeilgeoirguides.com

      # Off-site copies of the nightly backup. A backup that lives on the disk
      # it is backing up is one failure away from being no backup. Any
      # S3-compatible storage; leave blank and backups stay local-only.
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false

      # Email through Resend on its own subdomain.
      #
      # Two reasons it is send. rather than hub. — one of them a hard DNS rule.
      # hub.gaeilgeoirguides.com is a CNAME pointing at Render, and a CNAME
      # cannot share its name with any other record, so the mail records simply
      # could not live there. And keeping sending on a separate subdomain leaves
      # the root domain's existing Gmail and GoHighLevel SPF untouched, which is
      # what stops this from disturbing mail that already works.
      #
      # Replies go to the real inbox, not to the sending address, which nobody
      # reads.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM_NAME
        value: Gaeilgeoir Guides
      - key: EMAIL_FROM_ADDRESS
        value: no-reply@send.gaeilgeoirguides.com
      - key: EMAIL_REPLY_TO
        value: info@gaeilgeoirguides.com

      # Optional. Each one is a feature that hides itself when its key is
      # absent, so the portal runs without any of them.
      - key: OPENAI_API_KEY
        sync: false
      - key: BUNNY_LIBRARY_ID
        sync: false
      - key: BUNNY_API_KEY
        sync: false
      - key: BUNNY_TOKEN_KEY
        sync: false
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_WEBHOOK_SECRET
        sync: false

databases:
  - name: gg-class-portal-db
    region: frankfurt
    plan: basic-256mb
    databaseName: gg_class_portal
    user: gg_class_portal
