.toggle input:checked+span{background:var(--brand-500)}.toggle input:checked+span:after{transform:translateX(16px)}
.toggle input:focus-visible+span{box-shadow:0 0 0 4px rgba(80,175,55,.20)}

.student-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:26px 28px;margin-bottom:18px;border:1px solid #d7ead0;border-radius:var(--radius-xl);background:radial-gradient(circle at 88% 6%,rgba(80,175,55,.15),transparent 32%),linear-gradient(135deg,#fbfef9,#f3faef)}

.deadline-list{display:grid;gap:9px}.deadline-card{position:relative;overflow:hidden;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff}
.deadline-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gray-300)}

.overlay{position:fixed;inset:0;z-index:80;background:rgba(16,24,40,.42);backdrop-filter:blur(2px)}

.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:13px 21px;border-top:1px solid var(--border);background:var(--gray-25)}
.close{width:32px;height:32px;border:0;border-radius:var(--radius-sm);display:grid;place-items:center;background:transparent;color:var(--text-quaternary)}.close:hover{background:var(--gray-100);color:var(--text-secondary)}

.drawer-body{flex:1;overflow:auto;padding:21px 22px;background:var(--gray-25)}.drawer-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 22px;border-top:1px solid var(--border);background:#fff}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.detail{padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff}
.detail strong{display:block;color:var(--text-secondary);font-size:11px}.detail span{display:block;margin-top:3px;color:var(--text-tertiary);font-size:9px}
.section-title{margin:18px 0 7px;color:var(--text-secondary);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.review-nav{display:flex;align-items:center;gap:7px}
.kbd,kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border:1px solid var(--gray-300);border-bottom-width:2px;border-radius:5px;background:#fff;color:var(--text-tertiary);font-size:9px;font-weight:650;box-shadow:var(--shadow-xs)}

.empty-state{padding:42px 24px;text-align:center;border:1px dashed var(--border-strong);border-radius:var(--radius-lg);background:var(--gray-25)}
.empty-state h3{margin:0 0 5px;color:var(--text-secondary);font-size:13px}.empty-state p{max-width:430px;margin:0 auto;color:var(--text-tertiary);font-size:10px;line-height:16px}
#toast-root{position:fixed;right:22px;bottom:22px;z-index:120;display:grid;gap:8px}
.toast{min-width:250px;max-width:370px;padding:11px 13px;border-radius:var(--radius-sm);background:var(--gray-900);color:#fff;font-size:11px;line-height:16px;box-shadow:var(--shadow-lg)}
.toast.error{background:var(--error-700)}

.mobile-menu{display:none}

@media(max-width:920px){.app-shell{grid-template-columns:82px minmax(0,1fr)}.sidebar{padding-left:10px;padding-right:10px}.sidebar-brand .brand-lockup>span:last-child,.nav-button>span:not(.nav-icon),.nav-label{display:none}.sidebar-brand{padding-left:11px}.nav-button{justify-content:center;padding:9px}.nav-button.active:before{left:-10px}.content{padding:28px 22px 54px}.class-grid,.assignment-grid{grid-template-columns:1fr}}

@media(max-width:480px){.stats{grid-template-columns:1fr}.actions{width:100%}.actions .btn{flex:1}}

/* V14 Untitled UI icon integration and compatibility */
:root{
  --green-soft:var(--success-50);
  --green-deep:var(--success-700);
  --orange-soft:var(--warning-50);
  --orange-dark:var(--warning-700);
  --red-soft:var(--error-50);
  --red-dark:var(--error-700);
  --grey-soft:var(--gray-100);
  --grey-dark:var(--gray-600);
}
.btn svg,.close svg,.text-link svg{width:16px;height:16px;flex:0 0 auto}
.close svg{width:18px;height:18px}

/* ============================================================
   Weekly tracker
   Every status tile is an icon over exactly one line of label, laid out in
   fixed grid rows so icons and text share a baseline across the whole row
   regardless of how long any individual label is.
   ============================================================ */
:root{--warning-25:#fffcf5;--warning-200:#fedf89;--success-200:#a9efc5;--error-200:#fecdca}

.wk-cell,.week-card-actions{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));background:var(--white)}
.wk-cell{min-height:80px}

.wk-action{
  min-width:0;
  display:grid;grid-template-rows:32px 14px;align-content:center;justify-items:center;gap:7px;
  border:0;border-right:1px solid var(--border);border-radius:0;
  background:transparent;padding:12px 5px;box-shadow:none;
  transition:background .13s;
}
.wk-action:last-child{border-right:0}
.wk-action:not(:disabled):hover{background:var(--gray-50)}
.wk-action:not(:disabled):hover .status-icon{transform:translateY(-1px)}
.wk-action:focus-visible{outline:2px solid var(--brand-500);outline-offset:-2px}
.wk-action:disabled{cursor:default}
/* Anything waiting on the teacher gets a warm wash, so the work queue is
   findable at a glance without adding more text. */
.wk-action.needs-review{background:var(--warning-25)}
.wk-action.needs-review:hover{background:var(--warning-50)}

.status-icon{
  position:relative;width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;padding:0;line-height:0;overflow:visible;
  transition:transform .13s;
}
.status-icon svg{display:block;width:16px;height:16px;stroke-width:2}
.status-icon svg path{vector-effect:non-scaling-stroke}
.status-icon.green{background:var(--success-50);color:var(--success-700);border-color:var(--success-100)}
.status-icon.orange{background:var(--warning-100);color:var(--warning-700);border-color:var(--warning-200)}
.status-icon.red{background:var(--error-50);color:var(--error-700);border-color:var(--error-100)}
.status-icon.grey{background:var(--gray-50);color:var(--gray-500);border-color:var(--gray-200)}
.status-icon.blue{background:var(--blue-50);color:var(--blue-700);border-color:var(--blue-100)}

.status-label{
  max-width:100%;
  color:var(--text-tertiary);font-size:9px;line-height:14px;font-weight:600;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* A counted badge rather than a bare dot: it reads as "one new thing", and it
   disappears the moment the student opens the feedback. */
.unread-badge{position:absolute;right:-7px;top:-7px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;border-radius:999px;background:var(--error-500);border:2px solid #fff;color:#fff;font-size:9px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

/* Week column headings: name, due time, then one icon per action. */
.week-head{width:210px;min-width:210px;padding:0;text-align:left;vertical-align:top}
.week-head-inner{padding:10px 12px 8px}
.week-name{display:flex;align-items:center;gap:6px;min-width:0;color:var(--text-secondary);font-size:12px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.week-now{flex:0 0 auto;padding:2px 6px;border-radius:999px;background:var(--brand-100);color:var(--brand-800);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.week-due{margin-top:3px;color:var(--text-quaternary);font-size:9px;line-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-head.is-current{box-shadow:inset 0 2px 0 var(--brand-500)}
.week-head.is-current .week-name{color:var(--brand-800)}
.week-cols{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));border-top:1px solid var(--border)}
.week-col{display:grid;place-items:center;padding:6px 3px;border-right:1px solid var(--border);color:var(--text-quaternary)}
.week-col:last-child{border-right:0}
.week-col svg{width:14px;height:14px;stroke-width:2}
.week-data{width:210px;min-width:210px;padding:0;background:var(--white)}
.week-data.is-current{background:var(--brand-25)}
.week-data.is-current .wk-cell{background:transparent}

/* Legend: what the columns are, then what the colours mean. */
.legend{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);background:var(--gray-25)}
.legend-group{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.legend-title{color:var(--text-quaternary);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.legend-item{display:flex;align-items:center;gap:7px;color:var(--text-tertiary);font-size:10px;font-weight:550}
.legend-icon{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;border:1px solid transparent;flex:0 0 auto}
.legend-icon svg{width:13px;height:13px;stroke-width:2}
.legend-icon.green{background:var(--success-50);color:var(--success-700);border-color:var(--success-100)}
.legend-icon.orange{background:var(--warning-100);color:var(--warning-700);border-color:var(--warning-200)}
.legend-icon.grey{background:var(--gray-50);color:var(--gray-500);border-color:var(--gray-200)}
.legend-icon.red{background:var(--error-50);color:var(--error-700);border-color:var(--error-100)}
.legend-icon.blue{background:var(--blue-50);color:var(--blue-700);border-color:var(--blue-100)}
.legend-icon.plain{background:var(--white);color:var(--text-tertiary);border-color:var(--border-strong)}
.empty-note{color:var(--text-tertiary);font-size:11px}

/* Student tracker: one week per row, newest first, so it reads as a timeline
   rather than a wall of cards. The current week is called out at the top. */
.student-tracker{overflow:hidden}
.week-card-grid{display:grid;gap:12px;padding:16px}
.week-card{display:grid;grid-template-columns:minmax(200px,240px) minmax(0,1fr);align-items:stretch;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--white);overflow:hidden;box-shadow:var(--shadow-xs)}
.week-card.is-open{border-color:var(--brand-200)}
.week-card.is-current{border-color:var(--brand-400);box-shadow:0 0 0 3px rgba(80,175,55,.10)}
.week-card-head{display:flex;align-items:center;padding:14px 16px;border-right:1px solid var(--border);background:var(--gray-25)}
.week-card.is-current .week-card-head{background:var(--brand-25)}
.week-card-head strong{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text-secondary);font-size:13px;font-weight:680}
.week-card-head span{display:block;margin-top:3px;color:var(--text-quaternary);font-size:10px}
.week-card-actions .wk-action{grid-template-rows:32px 14px 14px;padding:16px 5px}
.week-card-note{grid-column:1/-1}
.wk-name{max-width:100%;color:var(--text-secondary);font-size:10px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-card-note{margin:0;padding:9px 14px;border-top:1px solid var(--border);background:var(--gray-25);color:var(--text-quaternary);font-size:9px}

.stack-top{margin-top:18px}

/* ============================================================
   Homework calendar
   Teaching weeks are drawn in behind the deadlines, so a week with no homework
   reads as a deliberate gap rather than as missing data.
   ============================================================ */
.view-switch{display:inline-flex;padding:3px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--gray-50)}
.view-tab{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:5px 11px;border:0;border-radius:6px;background:transparent;color:var(--text-tertiary);font-size:11px;font-weight:650}
.view-tab svg{width:14px;height:14px;stroke-width:2}
.view-tab:hover{color:var(--text-secondary)}
.view-tab.active{background:var(--white);color:var(--brand-800);box-shadow:var(--shadow-xs)}
.select{min-height:36px;width:auto;padding:6px 10px;font-size:11px}

.assignment-calendar{padding:0;overflow:hidden}
.assignment-calendar .calendar-head{padding:16px 18px 12px;margin:0}
.assignment-calendar .calendar-grid{border-left:0;border-right:0}
.assignment-calendar .calendar-day{min-height:104px;display:flex;flex-direction:column;gap:4px}
.calendar-day.is-teaching{background:var(--brand-25)}
/* A teaching week with nothing set says so once, on its first day, rather than
   shading seven cells and drowning out the deadlines that are set. */
.no-homework-chip{align-self:flex-start;padding:3px 7px;border:1px dashed var(--border-strong);border-radius:5px;color:var(--text-quaternary);font-size:8px;font-weight:650;line-height:1.2}
.calendar-day.is-today{box-shadow:inset 0 2px 0 var(--brand-500)}
.calendar-day-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:18px}
.day-add{width:19px;height:19px;display:grid;place-items:center;border:1px solid var(--border-strong);border-radius:5px;background:var(--white);color:var(--text-tertiary);font-size:12px;line-height:1;opacity:0;transition:opacity .12s,background .12s}
.calendar-day:hover .day-add{opacity:1}
.day-add:hover{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
.day-add:focus-visible{opacity:1;outline:2px solid var(--brand-500);outline-offset:1px}

.calendar-event.assignment{display:flex;flex-direction:column;gap:1px;margin-top:0;padding:5px 7px;border-radius:6px;border:1px solid transparent;text-align:left}
.calendar-event.assignment .event-time{font-size:8px;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
.calendar-event.assignment .event-title{font-size:9px;font-weight:650;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.calendar-event.assignment.open{background:var(--brand-50);border-color:var(--brand-200);color:var(--brand-800)}
.calendar-event.assignment.closed{background:var(--gray-100);border-color:var(--gray-200);color:var(--text-secondary)}
.calendar-event.assignment.archived{background:var(--white);border-color:var(--border-strong);color:var(--text-quaternary);border-style:dashed}
.calendar-event.assignment:hover{filter:brightness(.97)}

.legend-swatch{width:14px;height:14px;border-radius:4px;border:1px solid transparent;flex:0 0 auto}
.legend-swatch.open{background:var(--brand-50);border-color:var(--brand-200)}
.legend-swatch.closed{background:var(--gray-100);border-color:var(--gray-200)}
.legend-swatch.archived{background:var(--white);border:1px dashed var(--border-strong)}
.legend-swatch.teaching{background:var(--brand-25);border-color:var(--brand-200)}
.legend-swatch.none{background:var(--white);border:1px dashed var(--border-strong)}

/* A standing warning, not a toast: the condition it describes persists. */
.notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 16px;margin-bottom:18px;border-radius:var(--radius-lg);border:1px solid var(--warning-200);background:var(--warning-25)}
.notice strong{color:var(--warning-700);font-size:12px;font-weight:700}
.notice span{flex:1;min-width:240px;color:#8a5a12;font-size:11px;line-height:1.6}
.notice .btn{margin-left:auto}
.btn.danger.small{background:var(--error-50);border-color:var(--error-100);color:var(--error-700)}
.btn.danger.small:hover{background:var(--error-100);border-color:var(--error-200)}

.assignment-card.is-archived{background:var(--gray-25);border-style:dashed}
.assignment-card h3 .pill{margin-left:8px;vertical-align:middle}
.how-to{margin:0;padding-left:18px;color:var(--text-secondary);font-size:11px;line-height:1.75}
.how-to strong{color:var(--text)}
#feed-url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}

/* ============================================================
   Voice: dictation buttons, the voice-note recorder and playback
   ============================================================ */
.dictate-btn{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 10px;border:1px solid var(--border-strong);border-radius:999px;background:var(--white);color:var(--text-secondary);font-size:11px;font-weight:650;box-shadow:var(--shadow-xs);transition:background .14s,border-color .14s,color .14s}
.dictate-btn svg{width:14px;height:14px;stroke-width:2}
.dictate-btn:hover{background:var(--brand-25);border-color:var(--brand-300);color:var(--brand-800)}
.dictate-btn.is-recording{background:var(--error-600);border-color:var(--error-600);color:#fff;animation:pulse-record 1.6s ease-in-out infinite}
.dictate-btn.is-working{background:var(--gray-100);border-color:var(--border-strong);color:var(--text-tertiary);cursor:progress}
.dictate-timer{font-variant-numeric:tabular-nums;font-size:10px;opacity:.85}
@keyframes pulse-record{0%,100%{box-shadow:0 0 0 0 rgba(240,68,56,.45)}50%{box-shadow:0 0 0 5px rgba(240,68,56,0)}}
@media(prefers-reduced-motion:reduce){.dictate-btn.is-recording{animation:none}}

.voice-note-card{margin-top:16px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--white);overflow:hidden}
.voice-note-card.student{margin:0 0 18px}
.voice-note-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--gray-25)}
.voice-note-title{display:inline-flex;align-items:center;gap:7px;color:var(--text-secondary);font-size:11px;font-weight:650}
.voice-note-title svg{width:14px;height:14px;stroke-width:2;color:var(--brand-600)}
.voice-note-body{padding:14px}
.voice-recorder{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.record-btn{gap:8px}
.record-btn svg{width:15px;height:15px;stroke-width:2}
.record-btn.is-recording{background:var(--error-600);border-color:var(--error-600);color:#fff}
.record-btn.is-recording:hover{background:var(--error-700);border-color:var(--error-700)}
.record-status{color:var(--text-tertiary);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.level-meter{flex:1;min-width:60px;height:4px;border-radius:999px;background:var(--gray-100);overflow:hidden}
.level-meter i{display:block;height:100%;width:calc(var(--level,0)*100%);background:var(--brand-500);border-radius:999px;transition:width .12s linear}
.level-meter:not(.is-live) i{width:0}
.voice-player{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.voice-player audio{flex:1;min-width:220px;height:36px}
.voice-length{color:var(--text-tertiary);font-size:11px;font-weight:650;font-variant-numeric:tabular-nums}
.btn.small.danger{background:var(--error-50);border-color:var(--error-100);color:var(--error-700)}

/* Student profile notes */
.note-compose{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 4px}
.note-card{padding:12px 14px;margin-bottom:9px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff}
.note-card.is-pinned{border-color:var(--brand-200);background:var(--brand-25)}
.note-card header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;color:var(--text-quaternary);font-size:9px;font-weight:650}
.note-card p{margin:0;color:var(--text-secondary);font-size:11px;line-height:1.6;white-space:pre-wrap}
.drawer-footer .muted.small{display:inline-flex;align-items:center;gap:6px}
.drawer-footer .muted.small svg{width:13px;height:13px;stroke-width:2}

/* Deadlines column: overdue sits above upcoming and is impossible to miss. */
.deadline-column{display:grid;gap:14px;align-content:start}
.overdue-card{border-color:var(--error-100)}
.overdue-card .card-header{background:var(--error-50);border-bottom-color:var(--error-100);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.overdue-card .card-header h2{color:var(--error-700)}
.overdue-card .card-header p{color:#9a3a30}
.preview-console{
  position:fixed;left:18px;bottom:18px;z-index:300;
  display:flex;align-items:center;gap:5px;padding:5px;
  border:1px solid rgba(234,236,240,.95);border-radius:10px;
  background:rgba(255,255,255,.96);box-shadow:var(--shadow-lg);
  backdrop-filter:blur(14px)
}
.preview-console button{
  min-height:30px;border:0;border-radius:7px;background:transparent;
  color:var(--text-tertiary);padding:6px 9px;font-size:10px;font-weight:650
}
.preview-console button:hover{background:var(--gray-50);color:var(--text-secondary)}
.preview-console button.active{background:var(--brand-50);color:var(--brand-800)}
.preview-console .preview-separator{width:1px;height:20px;background:var(--border)}
.preview-console-label{padding:0 5px;color:var(--text-quaternary);font-size:9px}

@media(max-width:760px){
  .week-card{grid-template-columns:1fr}
  .week-card-head{border-right:0;border-bottom:1px solid var(--border)}
  .week-card-grid{padding:12px}
  .legend{gap:16px;padding:12px}
  .voice-player audio{min-width:0;width:100%}
  .note-compose{flex-direction:column;align-items:stretch}
  /* Above the bottom navigation, not on top of it. Preview only. */
  .preview-console{left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));justify-content:center}
  .preview-console-label{display:none}
  .preview-console button{flex:1}
}
textarea.tall{min-height:220px}

/* Check-in schedule table: dense, editable, with switched-off weeks receding. */
.checkin-table td{vertical-align:middle}
.checkin-table .pick{width:34px;padding-left:14px}
.checkin-table input[type=checkbox]{width:auto;box-shadow:none}
.checkin-table tr.is-off{background:var(--gray-25);color:var(--text-quaternary)}
.checkin-table tr.is-off strong{color:var(--text-tertiary)}
.checkin-table tr.is-past td{opacity:.72}
input.compact,select.compact{min-height:32px;padding:5px 8px;font-size:11px;box-shadow:none}

/* The panel shown when a tracker cell has nothing in it. */
.missing-panel{display:flex;align-items:flex-start;gap:12px;margin-top:16px;padding:14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--white)}
.missing-panel.is-closed{border-color:var(--error-100);background:var(--error-50)}
.missing-panel.is-open{border-color:var(--border-strong)}
.missing-panel strong{display:block;color:var(--text-secondary);font-size:12px;font-weight:650}
.missing-panel span{display:block;margin-top:4px;color:var(--text-tertiary);font-size:11px;line-height:1.6}
.missing-panel .status-icon{flex:0 0 auto}
#nudge-history{margin-top:12px}

/* The student cell always shows it can be opened, not only on hover. */
.student-cell-go{opacity:.35}

/* Check-in schedule builder */
.schedule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.inline-fields{display:flex;gap:8px}
.inline-fields select{flex:1.2}.inline-fields input{flex:1}
.schedule-preview{margin-top:8px}
.schedule-summary{padding:10px 12px;margin-bottom:10px;border-radius:var(--radius-sm);background:var(--brand-25);border:1px solid var(--brand-100);color:var(--brand-800);font-size:11px}
.schedule-list{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
.schedule-list li{padding:9px 12px;border-bottom:1px solid var(--border)}
.schedule-list li:last-child{border-bottom:0}
.schedule-list li.is-skipped{background:var(--gray-25)}
.schedule-week{display:flex;flex-direction:column;gap:2px}
.schedule-week strong{color:var(--text-secondary);font-size:11px;font-weight:650}
.schedule-week span{color:var(--text-quaternary);font-size:10px}
.schedule-list li.is-skipped .schedule-week strong{color:var(--text-quaternary)}
@media(max-width:760px){.schedule-grid{grid-template-columns:1fr}}

/* Engagement: how the class is actually going. */
.engagement{margin-bottom:12px}
.engagement-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.engagement-stat.wide{grid-column:1/-1}
.engagement-value{color:var(--text);font-size:30px;line-height:1.1;font-weight:680;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.engagement-label{margin-top:3px;color:var(--text-tertiary);font-size:11px;font-weight:650}
.meter{height:5px;margin:10px 0 7px;border-radius:999px;background:var(--gray-100);overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px;transition:width .3s}
.meter span.good{background:var(--success-500)}
.meter span.warn{background:var(--warning-500)}
.engagement-note{color:var(--text-quaternary);font-size:10px;line-height:1.5}
.withdrawal-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:7px}
.withdrawal-list li{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:7px;border-bottom:1px solid var(--border)}
.withdrawal-list li:last-child{border-bottom:0;padding-bottom:0}
.withdrawal-list span{flex:1;min-width:160px;color:var(--text-tertiary);font-size:11px}
.withdrawal-list small{color:var(--text-quaternary);font-size:10px}

/* A student who has left stays visible but stops competing for attention. */
.tracker-table tr.is-withdrawn .wk-cell{opacity:.4}
.tracker-table tr.is-withdrawn .student-cell{opacity:.8}
.student-name .pill{margin-left:7px;vertical-align:middle}

.withdrawal-card{padding:14px;margin-bottom:6px;border:1px solid var(--error-100);border-radius:var(--radius-lg);background:var(--error-50)}
.withdrawal-card header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.withdrawal-card header strong{color:var(--error-700);font-size:12px}
.withdrawal-card header span{color:#9a3a30;font-size:10px}
.withdrawal-reason{margin:8px 0 0;color:var(--text-secondary);font-size:12px;font-weight:650}
.withdrawal-card p{margin:6px 0 0;color:var(--text-secondary);font-size:11px;line-height:1.6;white-space:pre-wrap}
.withdrawal-ratings{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--text-tertiary);font-size:10px}
.withdrawal-ratings strong{color:var(--text-secondary)}
.withdrawal-answer{margin-top:10px}
.withdrawal-answer small{color:var(--text-quaternary);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}

/* The leaving section: present, findable, and not shouting. */
.account-card{max-width:650px}
details.leaving{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--gray-25)}
details.leaving summary{padding:13px 18px;color:var(--text-tertiary);font-size:11px;font-weight:650;cursor:pointer;list-style:none}
details.leaving summary::-webkit-details-marker{display:none}
details.leaving summary:before{content:"›";display:inline-block;margin-right:9px;transition:transform .15s}
details.leaving[open] summary:before{transform:rotate(90deg)}
details.leaving summary:hover{color:var(--text-secondary)}
.leaving-body{padding:0 18px 18px}
.leaving-body p{margin:0 0 10px;color:var(--text-tertiary);font-size:11px;line-height:1.65}

.withdrawal-form .section-title:first-of-type{margin-top:22px}
.rating-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rating{width:38px;height:38px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:#fff;color:var(--text-secondary);font-weight:650}
.rating:hover{border-color:var(--brand-300);background:var(--brand-25)}
.rating.selected{background:var(--brand-600);border-color:var(--brand-600);color:#fff}

/* Settings behind the name: Options, then Stepping Back, then the form. */
.options-block{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--gray-25)}
.options-block summary{padding:12px 16px;color:var(--text-tertiary);font-size:11px;font-weight:650;cursor:pointer;list-style:none}
.options-block summary::-webkit-details-marker{display:none}
.options-block summary:before{content:"›";display:inline-block;margin-right:9px;transition:transform .15s}
.options-block[open]>summary:before{transform:rotate(90deg)}
.options-block summary:hover{color:var(--text-secondary)}
.options-body{padding:0 16px 16px}
.options-block.nested{background:#fff;margin-top:2px}
.options-body p{margin:0 0 12px;color:var(--text-tertiary);font-size:11px;line-height:1.65}

/* A week with no homework says so, rather than quietly dropping the column. */
.status-icon.none{background:transparent;color:var(--gray-300);border:1px dashed var(--border-strong)}
.wk-action:disabled .status-icon.none{opacity:.85}

/* Assignment upload settings */
.upload-settings{padding:14px;margin-bottom:16px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--gray-25)}
.upload-settings.is-on{border-color:var(--brand-200);background:var(--brand-25)}
.upload-settings-body{margin-top:12px}
.file-type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:10px 0}
.file-type{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;cursor:pointer}
.file-type:hover{border-color:var(--brand-300)}
.file-type input{width:auto;margin-top:2px;box-shadow:none}
.file-type strong{display:block;color:var(--text-secondary);font-size:11px;font-weight:650}
.file-type small{display:block;margin-top:2px;color:var(--text-quaternary);font-size:10px}
.upload-settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:4px}
.inline-number{display:inline-flex;align-items:center;gap:7px;color:var(--text-secondary);font-size:11px;font-weight:600}
.inline-number input{width:64px;min-height:32px;padding:5px 8px;font-size:11px}

/* Where a student hands work up */
.upload-panel{margin-top:18px;padding:14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--gray-25)}
.upload-panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.upload-panel-head strong{color:var(--text-secondary);font-size:12px;font-weight:650}
.upload-list{display:grid;gap:7px;margin-bottom:10px}
.upload-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff}
.upload-name{flex:1;min-width:140px;color:var(--text-secondary);font-size:11px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-meta{color:var(--text-quaternary);font-size:10px}
.upload-drop{display:flex;flex-direction:column;align-items:center;gap:5px;padding:18px;border:1px dashed var(--border-strong);border-radius:var(--radius-sm);background:#fff;cursor:pointer;text-align:center}
.upload-drop:hover{border-color:var(--brand-400);background:var(--brand-25)}
.upload-drop span{display:inline-flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:12px;font-weight:650}
.upload-drop span svg{width:16px;height:16px;stroke-width:2}
.upload-drop small{color:var(--text-quaternary);font-size:10px;line-height:1.5;max-width:340px}
.upload-status{margin-top:8px;font-size:11px}
.upload-status.busy{color:var(--text-tertiary)}
.upload-status.error{color:var(--error-700)}

/* What the teacher sees of an upload */
.submitted-file{margin-bottom:9px}
.submitted-file-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.extracted{margin-top:7px}
.extracted summary{color:var(--text-tertiary);font-size:10px;font-weight:650;cursor:pointer}
.extracted summary:hover{color:var(--text-secondary)}
.extracted .answer-box{margin-top:6px}

/* A student's own answers read back to them. */
.my-answers{display:grid;gap:9px}
.my-answer{padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff}
.my-answer small{display:block;color:var(--text-quaternary);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.my-answer p{margin:6px 0 0;color:var(--text-secondary);font-size:12px;line-height:1.65;white-space:pre-wrap}
.my-files{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.legend-icon.none{background:transparent;color:var(--gray-400);border:1px dashed var(--border-strong)}

/* In-page confirmation, replacing the browser dialog that sandboxed frames refuse. */
.confirm-layer .overlay{z-index:100}
.confirm-layer .modal{z-index:101}
.confirm-modal{width:min(440px,calc(100vw - 28px))}
.confirm-modal .modal-head{padding-bottom:0;border-bottom:0}
.confirm-modal .modal-head h2{font-size:15px}
.confirm-message{margin:10px 0 0;color:var(--text-tertiary);font-size:12px;line-height:1.65}

/* One check-in or assignment at a time, so a bad week cannot hide inside the average. */
.breakdown{padding-top:16px;border-top:1px solid var(--border)}
.breakdown-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.breakdown-head select{max-width:min(360px,100%);padding:7px 10px;border:1px solid var(--border);border-radius:9px;background:var(--white);color:var(--text);font:inherit;font-size:12px}
.breakdown-body{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:22px;align-items:start}
.breakdown-figure .engagement-value{margin-bottom:2px}
.breakdown-missing{min-width:0}
.missing-names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.missing-names .text-link{padding:4px 9px;border:1px solid var(--border);border-radius:999px;background:var(--gray-50);font-size:12px}
.missing-names .text-link:hover{border-color:var(--error-500);color:var(--error-600);background:var(--white)}
.all-in{margin-top:8px;color:var(--success-600);font-size:12px;font-weight:600}
@media (max-width:720px){.breakdown-body{grid-template-columns:1fr}}

/* Handing work in should feel like something. */
.confetti-canvas{position:fixed;inset:0;z-index:200;pointer-events:none}
.celebrate{padding:6px 4px 2px;text-align:center}
.celebrate h2{margin:14px 0 6px;color:var(--text);font-size:21px;font-weight:680;letter-spacing:-.025em}
.celebrate>p{margin:0;color:var(--text-tertiary);font-size:13px;line-height:1.6}
.celebrate-tick{display:flex;justify-content:center}
.celebrate-tick svg{width:64px;height:64px;fill:none;stroke:var(--success-500);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.celebrate-tick circle{stroke-dasharray:151;stroke-dashoffset:151;animation:tick-ring .5s cubic-bezier(.2,.7,.3,1) forwards}
.celebrate-tick path{stroke-dasharray:40;stroke-dashoffset:40;animation:tick-mark .35s cubic-bezier(.2,.7,.3,1) .34s forwards}
@keyframes tick-ring{to{stroke-dashoffset:0}}
@keyframes tick-mark{to{stroke-dashoffset:0}}
.celebrate-milestone{margin:13px auto 0;padding:11px 15px;max-width:max-content;border-radius:12px;background:var(--success-50);color:var(--success-700);font-size:13px}

/* The running total, so the work has a shape beyond the next deadline. */
.goal-strip{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:0 0 18px}
.goal{display:flex;align-items:baseline;gap:7px;padding:9px 14px;border:1px solid var(--border);border-radius:12px;background:var(--white)}
.goal strong{color:var(--text);font-size:17px;font-weight:700;letter-spacing:-.02em}
.goal span{color:var(--text-tertiary);font-size:11.5px}
@media(prefers-reduced-motion:reduce){
  .celebrate-tick circle,.celebrate-tick path{animation:none;stroke-dashoffset:0}
}

/* Clearing a deadline that has closed and can no longer be met. */
.deadline-card{position:relative}
.deadline-dismiss{position:absolute;top:8px;right:8px;width:24px;height:24px;display:grid;place-items:center;padding:0;border:0;border-radius:7px;background:transparent;color:var(--text-tertiary);font-size:17px;line-height:1;cursor:pointer;opacity:.55;transition:opacity .15s,background .15s,color .15s}
.deadline-dismiss:hover{opacity:1;background:var(--error-50);color:var(--error-600)}
.deadline-dismiss:focus-visible{opacity:1;outline:2px solid var(--error-500);outline-offset:1px}
.deadline-card.red strong,.deadline-card.red small{padding-right:22px}
.toast-action{margin-left:12px;padding:3px 9px;border:1px solid rgba(255,255,255,.35);border-radius:7px;background:transparent;color:inherit;font:inherit;font-size:12px;font-weight:640;cursor:pointer}
.toast-action:hover{background:rgba(255,255,255,.16)}

/* Reports the teacher runs on demand. */
.report-headline{display:flex;align-items:center;gap:20px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--gray-50)}
.report-headline-detail{flex:1;min-width:0}
.report-headline-detail .meter{margin:0 0 8px}
.report-headline-detail p{margin:0}
.report-table{width:100%;margin-top:8px;border-collapse:collapse;font-size:12.5px}
.report-table th{padding:7px 10px;color:var(--text-tertiary);text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.report-table td{padding:9px 10px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.report-table tr:last-child td{border-bottom:0}
.report-table tr.is-withdrawn{opacity:.6}

/* ------------------------------------------------------------------
   The class link, the library and the board.
   ------------------------------------------------------------------ */

/* Shown only in the hours around a class, so it can afford to be loud. */
.class-banner{display:flex;align-items:center;gap:14px;padding:14px 18px;margin:0 0 18px;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--surface);box-shadow:var(--shadow-xs)}
.class-banner.is-live{border-color:var(--brand-200);background:linear-gradient(135deg,#fbfef9,#f3faef)}
.class-banner-icon{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;border-radius:999px;background:var(--brand-50);border:1px solid var(--brand-200);color:var(--brand-700)}
.class-banner-icon svg{width:19px;height:19px}
.class-banner-copy{flex:1;min-width:0;display:grid;gap:3px}
.class-banner-copy strong{font-size:14px;font-weight:680;letter-spacing:-.02em}
.class-banner-copy span{color:var(--text-tertiary);font-size:12px}
.class-banner.is-live .class-banner-copy strong{color:var(--brand-800)}



/* ------------------------------------------------------------------
   The class feed.

   Discrete cards with air between them, pill filters, and a footer carrying the
   face of whoever spoke last — the shape people already know from every
   community tool they use.
   ------------------------------------------------------------------ */
.feed{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:24px;align-items:start}
.feed-col{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.feed-col>*{min-width:0}

.feed-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 18px}
.feed-head h1{margin:0;font-size:25px;line-height:1.1;font-weight:680;letter-spacing:-.04em}
.feed-head p{margin:5px 0 0;color:var(--text-tertiary);font-size:13px}
.feed-head-actions{display:flex;gap:8px;flex:0 0 auto}

.fa{width:42px;height:42px;flex:0 0 auto;border-radius:999px;object-fit:cover;display:grid;place-items:center;
  color:#fff;font-size:13px;font-weight:700;letter-spacing:-.02em;box-shadow:0 0 0 1px rgba(16,24,40,.06)}
.fa.sm{width:32px;height:32px;font-size:10px}
.fa.xs{width:22px;height:22px;font-size:8px}

.composer{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;cursor:pointer;
  border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--surface);box-shadow:var(--shadow-xs);transition:box-shadow .15s,border-color .15s}
.composer:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.composer-hint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-quaternary);font-size:14.5px}
.composer-icons{display:flex;gap:12px;color:var(--text-quaternary)}
.composer-icons svg{width:18px;height:18px}

/* Filters. The row scrolls sideways rather than wrapping, so a class with eight
   categories does not push the first post off the screen. */
.filters{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.cats{display:flex;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none;padding:1px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:7px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface);
  color:var(--text-secondary);font-size:13px;font-weight:620;white-space:nowrap}
.cat:hover{border-color:var(--border-strong);background:var(--gray-25)}
.cat.on{background:var(--gray-900);border-color:var(--gray-900);color:#fff}
.sorts{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--gray-100);flex:0 0 auto}
.sort{padding:5px 14px;border:0;border-radius:999px;background:transparent;color:var(--text-tertiary);font-size:12.5px;font-weight:650}
.sort.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-xs)}

.posts{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.post{padding:18px 20px;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--surface);
  box-shadow:var(--shadow-xs);cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .15s}
.post:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.post.is-removed{opacity:.5}
.post.is-scheduled{border-style:dashed;background:var(--gray-25)}
.post-top{display:flex;align-items:center;gap:12px}
.post-who{flex:1;min-width:0;display:grid;gap:1px}
.post-name{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:660;letter-spacing:-.01em}
.post-meta{color:var(--text-quaternary);font-size:12px}
.post-meta b{font-weight:650;color:var(--text-tertiary)}
.post-cat{flex:0 0 auto;padding:4px 10px;border-radius:999px;background:var(--gray-100);color:var(--text-secondary);
  font-size:11px;font-weight:650;white-space:nowrap}
.tag-teacher{font-style:normal;padding:2px 7px;border-radius:999px;background:var(--brand-600);color:#fff;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tag-sched{color:var(--warning-700)!important}
.tag-removed{color:var(--error-700)!important}
.post-title{margin:14px 0 6px;font-size:17.5px;line-height:1.32;font-weight:680;letter-spacing:-.03em}
.post-body{margin:0;color:var(--text-secondary);font-size:14px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post-foot{display:flex;align-items:center;gap:20px;margin-top:15px;padding-top:13px;border-top:1px solid var(--gray-100)}
.post-last{display:flex;align-items:center;gap:7px;margin-left:auto;color:var(--text-quaternary);font-size:11.5px}

.act{display:inline-flex;align-items:center;gap:7px;padding:0;border:0;background:transparent;color:var(--text-tertiary);font-size:13px;font-weight:650}
.act svg{width:19px;height:19px}
.act:hover{color:var(--text)}
.act.flat{pointer-events:none}
.act.on{color:var(--error-600)}
.act.on svg path{fill:var(--error-600);stroke:var(--error-600)}
.act.sm{margin-top:8px;font-size:12px}
.act.sm svg{width:16px;height:16px}

.att{display:grid;gap:9px;margin-top:14px}
.att-gif{max-width:min(100%,400px);border-radius:var(--radius-md);border:1px solid var(--border);display:block}
.att-strip{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--gray-25);color:var(--text-secondary);text-decoration:none;font-size:13px;font-weight:600}
.att-strip:hover{border-color:var(--border-strong);background:var(--gray-50)}
.att-strip svg{width:19px;height:19px;flex:0 0 auto;color:var(--text-tertiary)}
.att-strip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-strip em{font-style:normal;color:var(--text-quaternary);font-size:10px;font-weight:700;letter-spacing:.05em}
.att-video{position:relative;padding-top:56.25%;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);background:#000}
.att-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.feed-empty{padding:48px 30px;border:1px dashed var(--border-strong);border-radius:var(--radius-xl);background:var(--surface);text-align:center}
.feed-empty h3{margin:0 0 8px;font-size:16px;font-weight:680;letter-spacing:-.02em}
.feed-empty p{margin:0 auto;max-width:50ch;color:var(--text-tertiary);font-size:13.5px;line-height:1.65}

.side{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;position:sticky;top:16px;min-width:0}
.side-card{padding:16px;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--surface);box-shadow:var(--shadow-xs)}
.side-card h4{margin:0 0 11px;color:var(--text-tertiary);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.side-top{display:flex;align-items:center;gap:11px}
.side-mark{width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;border-radius:var(--radius-md);
  background:linear-gradient(140deg,var(--brand-700),var(--brand-500));color:#fff;font-size:12px;font-weight:700}
.side-top strong{display:block;font-size:13.5px;font-weight:680;letter-spacing:-.02em}
.side-top span{color:var(--text-tertiary);font-size:11.5px}

/* The next class, under the class name. Quiet most of the week; it earns the
   green and the button only once the class is actually close. */
.side-next{display:flex;align-items:center;gap:12px;margin:14px -16px -16px;padding:13px 16px;
  border-top:1px solid var(--gray-100);border-radius:0 0 var(--radius-xl) var(--radius-xl);
  background:var(--gray-25)}
.side-next-copy{flex:1;min-width:0;display:grid;gap:1px}
.side-next-copy span{color:var(--text-quaternary);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em}
.side-next-copy strong{font-size:13px;font-weight:660;letter-spacing:-.015em}
.side-next-copy em{color:var(--text-tertiary);font-size:11.5px;font-style:normal;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-next.is-live{background:var(--brand-25);border-top-color:var(--brand-100)}
.side-next.is-live .side-next-copy strong{color:var(--brand-700)}
.side-next .btn.small{flex:0 0 auto}

.rank{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rank li{display:flex;align-items:center;gap:10px;padding:6px 7px;margin:0 -7px;border-radius:var(--radius-sm)}
.rank li:hover{background:var(--gray-50)}
.rank-n{width:16px;flex:0 0 auto;color:var(--text-quaternary);font-size:11px;font-weight:700;text-align:center}
/* The top three are the only ones anybody reads as a position rather than a
   row, so they get the weight and the rest stay quiet. */
.rank li.is-top .rank-n{color:var(--brand-700)}
.rank-name{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li.is-top .rank-name{font-weight:650;color:var(--text-primary)}
.rank-v{flex:0 0 auto;min-width:22px;padding:1px 6px;border-radius:999px;background:var(--gray-100);
  color:var(--text-tertiary);font-size:11px;font-weight:650;text-align:center}
.rank li.is-top .rank-v{background:var(--brand-50);color:var(--brand-700)}
.side-empty{margin:0;color:var(--text-tertiary);font-size:12.5px;line-height:1.6}

/* ---- Writing a post ---------------------------------------------- */
.composer-form{display:flex;flex-direction:column}
.cw-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.cw-who{flex:1;min-width:0;display:grid;gap:1px}
.cw-who strong{font-size:13.5px;font-weight:660}

/* The category. A button and a menu rather than a native select, so it carries
   the application's styling instead of the operating system's. */
.cat-picker{position:relative}
.cat-button{display:inline-flex;align-items:center;gap:5px;padding:3px 7px 3px 8px;margin-left:-8px;
  border:0;border-radius:var(--radius-sm);background:transparent;
  color:var(--text-quaternary);font-size:12px;font-weight:500;cursor:pointer}
.cat-button:hover{background:var(--gray-100);color:var(--text-tertiary)}
.cat-button b{font-weight:660;color:var(--text-secondary)}
.cat-button svg{width:13px;height:13px;opacity:.7}
.cat-button[aria-expanded=true]{background:var(--gray-100)}
.cat-menu{position:absolute;top:calc(100% + 5px);left:-4px;z-index:30;min-width:190px;padding:5px;
  border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);
  box-shadow:var(--shadow-lg);display:grid;gap:1px}
.cat-option{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:8px 9px;border:0;border-radius:var(--radius-sm);background:transparent;
  font-size:13px;font-weight:560;color:var(--text-secondary);text-align:left;cursor:pointer}
.cat-option:hover{background:var(--gray-50)}
.cat-option svg{width:15px;height:15px;color:var(--brand-600);opacity:0;flex:0 0 auto}
.cat-option.is-on{color:var(--text-primary);font-weight:640}
.cat-option.is-on svg{opacity:1}
.cw-x{display:grid;place-items:center;width:30px;height:30px;flex:0 0 auto;border:0;border-radius:999px;background:transparent;color:var(--text-tertiary)}
.cw-x:hover{background:var(--gray-100)}
.cw-x svg{width:15px;height:15px}
.composer-form>input[name=title]{border:0;box-shadow:none;padding:2px 0 12px;font-size:22px;font-weight:680;letter-spacing:-.035em}
.composer-form>input[name=title]::placeholder{color:var(--text-quaternary)}
.composer-form>input[name=title]:focus{box-shadow:none}
.composer-form textarea{border:0;box-shadow:none;padding:0;min-height:180px;font-size:15px;line-height:1.65;resize:none}
.composer-form textarea:focus{box-shadow:none}
.cw-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.composer-tools{display:flex;gap:2px}
/* Icon-only, but each one says what it is on hover and to a screen reader. An
   icon whose meaning has to be guessed is the thing that made this row read as
   decoration rather than as controls. */
.tool{position:relative;display:grid;place-items:center;width:36px;height:36px;border:0;
  border-radius:var(--radius-sm);background:transparent;color:var(--text-tertiary);cursor:pointer}
.tool:hover{background:var(--gray-100);color:var(--text-secondary)}
.tool.is-on{background:var(--brand-50);color:var(--brand-700)}
.tool svg{width:18px;height:18px}
.tool::after{content:attr(aria-label);position:absolute;bottom:calc(100% + 7px);left:50%;
  transform:translateX(-50%);padding:4px 8px;border-radius:var(--radius-xs);
  background:var(--gray-900);color:#fff;font-size:11px;font-weight:600;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .12s}
.tool:hover::after,.tool:focus-visible::after{opacity:1}
.cw-actions{display:flex;align-items:center;gap:9px}
.cw-pin{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:var(--radius-sm);
  color:var(--text-tertiary);font-size:12.5px;font-weight:620;cursor:pointer}
.cw-pin:hover{background:var(--gray-50);color:var(--text-secondary)}
.cw-pin input{width:auto;margin:0}
/* Folded away until the calendar button is pressed, so an empty date field is
   not sitting in the middle of the dialog on every ordinary post. */
.schedule-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;
  margin-top:14px;padding:12px 13px;border:1px solid var(--brand-200);border-radius:var(--radius-md);
  background:var(--brand-25)}
.schedule-row label{font-size:12.5px;font-weight:640;color:var(--text-secondary)}
.schedule-row input[type=datetime-local]{padding:7px 10px;font-size:13px}
.schedule-row p{grid-column:1/-1;margin:0}
.cw-x.small{width:26px;height:26px}
.cw-x.small svg{width:13px;height:13px}
.sched-note{padding:11px 13px;margin-bottom:14px;border:1px solid var(--warning-100);border-radius:var(--radius-md);
  background:var(--warning-50);color:var(--warning-700);font-size:12.5px;font-weight:600}


.mod-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;padding-bottom:15px;border-bottom:1px solid var(--border)}
.opening .cmt-text{margin-top:13px}
.opening .act{margin-top:14px}
.cmt-count{margin:22px 0 13px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary)}
.cmts{display:grid;gap:17px}
.cmt{display:flex;gap:11px}
.cmt.is-removed{opacity:.55}
.cmt-body{flex:1;min-width:0}
.cmt-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.cmt-remove{border:0;background:transparent;padding:0;color:var(--text-quaternary);font-size:11px;font-weight:650}
.cmt-remove:hover{color:var(--error-600)}
.cmt-text{color:var(--text-secondary);font-size:13.5px;line-height:1.6;word-wrap:break-word}
.cmt-gone{margin:0;color:var(--text-quaternary);font-size:12.5px;font-style:italic}
.reply{display:flex;gap:11px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.reply-box{flex:1;min-width:0}
.reply-box .btn{margin-top:10px}
/* Grows with what is typed into it. A fixed height is right for an empty box and
   wrong the moment there is anything in it — most of all when a suggested reply
   has just been dropped in to be edited.

   No transition on the height, deliberately: an animating height makes
   scrollHeight report a value from part-way through the animation, so the box
   measures itself against a size it is still on its way to and settles at the
   cap. And the shared min-height has to go, or a two-line box cannot be two
   lines tall. */
.reply-box textarea[data-grow]{resize:none;min-height:0;height:auto}

/* Once the draft has been moved into the comment box, the panel steps back:
   the same words sitting in two places invites editing the wrong one. */
.rd.is-used{opacity:.7}
.rd.is-used .rd-head span:first-child{font-style:italic;font-weight:500}

.category-list{display:grid;gap:7px}
.category-row{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--gray-25)}
.category-row strong{flex:1;font-size:13px;font-weight:650}
.check-row{display:flex;align-items:center;gap:9px;margin-top:14px;color:var(--text-secondary);font-size:12.5px;font-weight:600;cursor:pointer}
.check-row input{width:auto;flex:0 0 auto;margin:0}

/* ---- Mobile ------------------------------------------------------
   The sidebar is gone below 760px, so a bar across the bottom carries the
   navigation. Everything else gets out of the feed's way: the side column drops
   underneath, the filters scroll sideways, and the two dialogs go full screen
   because a centred box on a phone is a box with nowhere to put a keyboard. */
.mobile-nav{display:none}

@media (max-width:1080px){
  .feed{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;order:1;grid-template-columns:1fr 1fr;display:grid}
  .feed-head{flex-direction:column;align-items:flex-start;gap:12px}
  .feed-head-actions{width:100%}
  .feed-head-actions .select{flex:1}
}

@media (max-width:760px){
  /* Nothing should scroll sideways on a phone. The category row is the one
     deliberate exception and carries its own overflow. */
  html,body{overflow-x:hidden}
  .mobile-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
  .mnav{flex:1;display:grid;justify-items:center;gap:3px;padding:7px 4px;border:0;border-radius:var(--radius-md);
    background:transparent;color:var(--text-quaternary);font-size:10.5px;font-weight:650;min-height:52px}
  .mnav.on{color:var(--brand-700)}
  .mnav-icon{position:relative;display:grid;place-items:center}
  .mnav-icon svg{width:22px;height:22px}
  .mnav-icon i{position:absolute;top:-5px;right:-9px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center;
    border-radius:999px;background:var(--error-500);color:#fff;font-size:9px;font-weight:700;font-style:normal}
  /* Room for the bar, plus whatever the phone puts below it. */
  .content{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important}

  .side{grid-template-columns:1fr;order:1}
  .composer{padding:12px 14px;border-radius:var(--radius-lg)}
  .composer-hint{font-size:14px}
  .post{padding:16px 15px;border-radius:var(--radius-lg)}
  .post-title{font-size:16.5px;margin-top:12px}
  .post-body{font-size:13.5px}
  .fa{width:38px;height:38px}
  .post-cat{display:none}
  /* Thumb-sized hit areas. The padding is pulled back out with negative margin
     so the row looks the same as it does on a desktop while being twice as easy
     to hit. */
  .post-foot{gap:22px}
  .act{padding:10px 6px;margin:-10px -6px}
  .act svg{width:21px;height:21px}
  .cat{padding:10px 15px;font-size:13px}
  .sort{padding:9px 16px;font-size:13px}
  .cmt-remove{padding:8px 0;margin:-8px 0}
  .post-last span{display:none}
  .feed-empty{padding:34px 20px}

  /* Both dialogs fill the screen. A 92vh centred card leaves a strip of feed
     visible top and bottom and nowhere sensible for the keyboard to go. */
  .modal,.modal.wide{inset:0;left:0;top:0;width:100%;max-width:100%;max-height:none;height:100dvh;transform:none;border-radius:0;border:0}
  /* The form fills the sheet so the toolbar and Post sit on the bottom edge
     where a thumb is, not floating in the middle of the screen. */
  .modal-body{flex:1;display:flex;min-height:0}
  .modal.bare .modal-body{padding:16px 16px 0}
  .composer-form{flex:1;min-height:0}
  .composer-form textarea{flex:1;min-height:120px}
  .drawer{width:100vw;height:100dvh;border-left:0}
  .composer-form textarea{min-height:34vh}
  .composer-form>input[name=title]{font-size:19px}
  /* Side by side there is not room for four tools, a pin label and two buttons:
     Post ended up off the edge of the screen. Two rows instead. */
  .cw-foot{position:sticky;bottom:0;flex-direction:column;align-items:stretch;gap:10px;
    background:var(--surface);margin-top:auto;
    padding-bottom:calc(4px + env(safe-area-inset-bottom))}
  .composer-tools{justify-content:flex-start}
  .cw-actions{width:100%;gap:8px}
  .cw-actions .btn{flex:1;padding:11px 15px;justify-content:center}
  .cw-pin{flex:0 0 auto;padding:6px 8px;white-space:nowrap}
  .tool{width:42px;height:42px}
  /* Touch has no hover, so the label would only ever flash on tap. */
  .tool::after{display:none}
  .schedule-row{grid-template-columns:minmax(0,1fr) auto}
  .schedule-row label{grid-column:1/-1}
  .cat-menu{left:0;right:auto;min-width:min(240px,calc(100vw - 48px))}
    .mod-bar{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .mod-bar::-webkit-scrollbar{display:none}
  .mod-bar .btn{flex:0 0 auto}
}

@media (max-width:420px){
  /* Narrower, not shorter: the height is what makes these hittable. */
  .cat{padding:10px 13px;font-size:12.5px}
  .sort{padding:9px 13px;font-size:12.5px}
  .post-foot{gap:20px}
}
.modal.bare .modal-body{padding:18px 20px 16px}

/* Reactions. Live counts only; the picker adds the rest. */
.rx-row{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.rx{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);border-radius:999px;
  background:var(--surface);color:var(--text-secondary);font-size:13px;line-height:1}
.rx:hover{border-color:var(--border-strong);background:var(--gray-25)}
.rx b{font-weight:650;font-size:11.5px;color:var(--text-tertiary)}
.rx.on{border-color:var(--brand-300);background:var(--brand-50)}
.rx.on b{color:var(--brand-800)}
.rx.add{padding:5px 8px;color:var(--text-quaternary)}
.rx.add svg{width:17px;height:17px}
.rx.add:hover{color:var(--brand-700);border-color:var(--brand-300)}
.rx.sm{padding:3px 8px;font-size:12px}
.rx.sm.add{padding:3px 7px}
.rx.sm.add svg{width:15px;height:15px}
.rx-pop{position:fixed;z-index:120;display:flex;gap:2px;padding:6px;border:1px solid var(--border);
  border-radius:999px;background:#fff;box-shadow:var(--shadow-lg)}
.rx-pop button{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:999px;background:transparent;font-size:19px;line-height:1}
.rx-pop button:hover{background:var(--gray-100);transform:scale(1.15)}
#video-preview{display:grid;gap:9px;margin-top:14px}
@media (max-width:760px){
  .rx{padding:8px 12px}
  .rx.add{padding:8px 10px}
  .rx-pop button{width:42px;height:42px;font-size:21px}
}

/* ------------------------------------------------------------------
   File attachments, in the Untitled UI shape the rest of this interface
   already borrows from: a dashed drop zone, then a row per file carrying its
   format, its size, and either a progress bar or a tick.
   ------------------------------------------------------------------ */
.fu-zone{position:relative;display:grid;justify-items:center;gap:5px;margin-top:14px;padding:16px 24px;
  border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);cursor:pointer;
  transition:border-color .15s,background .15s,box-shadow .15s}
.fu-zone:hover{border-color:var(--brand-300);background:var(--brand-25)}
.fu-zone.is-over{border-color:var(--brand-500);background:var(--brand-50);box-shadow:0 0 0 4px rgba(80,175,55,.12)}
.fu-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0;box-shadow:none}
.fu-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:999px;
  border:1px solid var(--border);background:var(--gray-50);color:var(--text-secondary)}
.fu-icon svg{width:18px;height:18px}
.fu-lead{color:var(--text-tertiary);font-size:13px}
.fu-lead b{color:var(--brand-700);font-weight:650}
.fu-hint{color:var(--text-quaternary);font-size:11.5px}

.fu-list{display:grid;gap:8px;margin-top:12px}
.fu-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);
  border-radius:var(--radius-lg);background:var(--surface)}
.fu-row.is-failed{border-color:var(--error-200,#fecdca);background:var(--error-50)}
.fu-badge{position:relative;display:grid;place-items:center;width:34px;height:40px;flex:0 0 auto;
  border:1px solid var(--border-strong);border-top-right-radius:9px;border-radius:4px 9px 4px 4px;background:var(--surface)}
.fu-badge i{font-style:normal;font-size:7.5px;font-weight:800;letter-spacing:.02em;color:#fff;
  padding:2px 4px;border-radius:3px;background:var(--text-quaternary)}
.fu-badge.fu-pdf i{background:var(--error-600)}
.fu-badge.fu-docx i{background:var(--blue-600)}
.fu-badge.fu-gif i,.fu-badge.fu-loom i,.fu-badge.fu-video i{background:var(--brand-600)}
.fu-badge img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.fu-copy{flex:1;min-width:0;display:grid;gap:2px}
.fu-copy strong{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fu-copy>span{color:var(--text-tertiary);font-size:11.5px}
.fu-row.is-failed .fu-copy>span{color:var(--error-700)}
.fu-bar{height:7px;margin-top:5px;border-radius:999px;background:var(--gray-200);overflow:hidden}
.fu-bar span{display:block;height:100%;border-radius:999px;background:var(--brand-600);transition:width .18s}
.fu-pct{flex:0 0 auto;color:var(--text-secondary);font-size:11.5px;font-weight:650}
.fu-done{flex:0 0 auto;display:grid;place-items:center;color:var(--brand-600)}
.fu-done svg{width:19px;height:19px}
.fu-x{flex:0 0 auto;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:var(--radius-sm);
  background:transparent;color:var(--text-quaternary)}
.fu-x:hover{background:var(--gray-100);color:var(--error-600)}
.fu-x svg{width:16px;height:16px}
@media (max-width:760px){
  .fu-zone{padding:18px 16px}
  .fu-x{width:40px;height:40px}
}

/* ------------------------------------------------------------------
   Courses: a shelf of cards, then a lesson page with the recording large and
   the contents beside it.
   ------------------------------------------------------------------ */
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.cc{border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--surface);overflow:hidden;
  box-shadow:var(--shadow-xs);cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .15s}
.cc:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.cc-cover{position:relative;aspect-ratio:16/9;display:grid;place-items:center;background-size:cover;background-position:center;
  background-image:linear-gradient(140deg,var(--brand-700),var(--brand-500))}
.cc-cover span{color:#fff;font-size:27px;font-weight:700;letter-spacing:-.04em;opacity:.9}
.cc-draft{position:absolute;top:10px;left:10px;padding:3px 8px;border-radius:999px;background:rgba(16,24,40,.72);
  color:#fff;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.cc-body{padding:15px 16px 17px}
.cc-body h3{margin:0 0 5px;font-size:15.5px;font-weight:680;letter-spacing:-.025em}
.cc-body p{margin:0;color:var(--text-tertiary);font-size:12.5px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.cc-count{color:var(--text-quaternary);font-size:11.5px;font-weight:600}
.cc-pct{color:var(--brand-700);font-size:11.5px;font-weight:700}
.cc-bar{height:6px;margin-top:7px;border-radius:999px;background:var(--gray-200);overflow:hidden}
.cc-bar span{display:block;height:100%;border-radius:999px;background:var(--brand-600);transition:width .25s}

.cp-back{display:inline-flex;align-items:center;gap:5px;margin-bottom:14px;padding:0;border:0;background:transparent;
  color:var(--text-tertiary);font-size:12.5px;font-weight:650}
.cp-back:hover{color:var(--text)}
.cp-back svg{width:15px;height:15px}
.cp-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.cp-stage{min-width:0}
.lp-frame{position:relative;padding-top:56.25%;border-radius:var(--radius-lg);overflow:hidden;background:#000;
  box-shadow:var(--shadow-md)}
.lp-frame iframe,.lp-frame video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.lp-empty{display:grid;place-items:center;align-content:center;gap:4px;aspect-ratio:16/9;border-radius:var(--radius-lg);
  border:1px dashed var(--border-strong);background:var(--gray-50);color:var(--text-tertiary);text-align:center;padding:20px}
.lp-empty strong{font-size:14px;font-weight:670;color:var(--text-secondary)}
.lp-empty span{font-size:12.5px}
.cp-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-top:18px}
.cp-meta h1{margin:0;font-size:21px;line-height:1.25;font-weight:680;letter-spacing:-.035em}
.cp-meta>div>span{display:block;margin-top:4px;color:var(--text-quaternary);font-size:12px}
.cp-actions{display:flex;gap:8px;flex:0 0 auto}
.cp-actions .btn.is-done{border-color:var(--brand-200);background:var(--brand-50);color:var(--brand-800)}
.cp-actions .btn.is-done svg{width:15px;height:15px;color:var(--brand-600)}
.cp-notes{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);
  color:var(--text-secondary);font-size:14px;line-height:1.65}

.lc{border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--surface);
  box-shadow:var(--shadow-xs);overflow:hidden;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
.lc-head{padding:15px 16px;border-bottom:1px solid var(--border)}
.lc-head strong{display:block;font-size:13.5px;font-weight:680;letter-spacing:-.02em}
.lc-head>span{display:block;margin-top:3px;color:var(--text-tertiary);font-size:11.5px}
.lc-mod{padding:11px 0}
.lc-mod+.lc-mod{border-top:1px solid var(--gray-100)}
.lc-mod h4{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 5px;padding:0 16px;
  color:var(--text-quaternary);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.lc-mod-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-mod-tools{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.lc-add{width:20px;height:20px;display:grid;place-items:center;border:0;border-radius:var(--radius-xs);
  background:var(--gray-100);color:var(--text-secondary);font-size:14px;line-height:1;cursor:pointer}
.lc-add:hover{background:var(--gray-200);color:var(--text-primary)}
.lc-add svg{width:13px;height:13px}
.lc-empty{margin:0;padding:2px 16px 6px;color:var(--text-quaternary);font-size:11.5px}
/* The row holds the lesson button and, for an administrator, its own menu.
   The menu is hidden until the row is hovered or focused, so the list still
   reads as a list of lessons rather than a list of controls. */
.ll-row{position:relative;display:flex;align-items:stretch}
.ll-row.on{background:var(--brand-25);box-shadow:inset 3px 0 0 var(--brand-600)}
.ll-row:hover{background:var(--gray-25)}
.ll-row.on:hover{background:var(--brand-25)}
.ll-menu{position:absolute;top:50%;right:8px;transform:translateY(-50%);
  display:grid;place-items:center;width:24px;height:24px;border:0;border-radius:var(--radius-xs);
  background:var(--surface);color:var(--text-tertiary);opacity:0;cursor:pointer;box-shadow:var(--shadow-xs)}
.ll-menu svg{width:14px;height:14px}
.ll-row:hover .ll-menu,.ll-menu:focus-visible{opacity:1}
.ll-menu:hover{color:var(--text-primary)}
.ll{display:flex;align-items:center;gap:11px;width:100%;padding:9px 16px;border:0;background:transparent;text-align:left}
.ll.on{box-shadow:none}
.ll.draft{opacity:.62}
.ll-tick{display:grid;place-items:center;width:22px;height:22px;flex:0 0 auto;border-radius:999px;
  border:1px solid var(--border-strong);color:var(--text-quaternary);font-size:10px;font-weight:700}
.ll-tick i{font-style:normal}
.ll-tick svg{width:22px;height:22px;color:var(--brand-600)}
.ll.done .ll-tick{border-color:transparent}
.ll-copy{min-width:0;display:grid;gap:1px}
.ll-copy strong{font-size:12.5px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ll.on .ll-copy strong{color:var(--brand-800)}
.ll-copy>span{color:var(--text-quaternary);font-size:10.5px}
.lc-newmod{margin:4px 16px 14px}
.form-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

@media (max-width:1080px){
  .cp-main{grid-template-columns:minmax(0,1fr)}
  .lc{position:static;max-height:none}
}
@media (max-width:760px){
  .cc-grid{grid-template-columns:1fr;gap:12px}
  .cp-meta{flex-direction:column;gap:12px}
  .cp-actions{width:100%}
  .cp-actions .btn{flex:1}
  .cp-meta h1{font-size:19px}
  .form-row{grid-template-columns:1fr}
  .lp-frame{border-radius:var(--radius-md)}
}

/* Importing from Zoom. */
.zi-setup ol{margin:12px 0 0;padding-left:20px;display:grid;gap:12px;font-size:13px;line-height:1.55}
.zi-setup code{padding:1px 5px;border-radius:4px;background:var(--gray-100);font-size:11.5px}
.zi-ok{color:var(--success-700);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.zi-no{color:var(--error-700);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.zi-list{display:grid;gap:8px;max-height:44vh;overflow-y:auto}
.zi-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);
  border-radius:var(--radius-md);background:var(--surface)}
.zi-row.is-done{background:var(--gray-25);opacity:.72}
.zi-copy{flex:1;min-width:0;display:grid;gap:2px}
.zi-copy strong{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zi-copy>span{color:var(--text-tertiary);font-size:11.5px}
.zi-err{color:var(--error-700)!important}
.zi-badge{flex:0 0 auto;padding:4px 9px;border-radius:999px;background:var(--success-50);color:var(--success-700);
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.zi-row .select{flex:0 0 auto;max-width:220px}
.zi-rules{display:grid;gap:6px;margin-bottom:12px}
.zi-rule{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--gray-25);font-size:12.5px}
.zi-rule strong{flex:0 0 auto}
.zi-rule>span.muted{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zi-newrule{display:grid;gap:8px;padding:13px;border:1px dashed var(--border-strong);border-radius:var(--radius-md);background:var(--gray-25)}
.zi-newrule input:not([type=checkbox]),.zi-newrule .select{width:100%}
@media (max-width:760px){
  .zi-row{flex-wrap:wrap}
  .zi-row .select{max-width:none;width:100%}
}

/* The drafted reply on the class board. Sits above the box rather than inside
   it: a draft that fills the box is one you must delete before you can
   disagree with it. */
.rd{margin-top:20px;padding:13px 15px;border:1px solid var(--brand-200);border-radius:var(--radius-md);background:var(--brand-25)}
.rd-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px}
.rd-head>span:first-child{color:var(--brand-800);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rd-tools{display:flex;gap:12px}
.rd-body{color:var(--text-secondary);font-size:13.5px;line-height:1.6}
.rd-fail{color:var(--text-tertiary);font-size:12.5px}
.rd p{margin:0}
.reply-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.reply-actions .btn{margin-top:0}
.rr{display:inline-flex;align-items:center;gap:9px}
.rr-status{color:var(--text-tertiary);font-size:11.5px}
.cmt-voice{margin-top:9px}
/* The chosen photograph, before and after it is sent.
   ------------------------------------------------------------------
   This had a size but nothing to keep a picture inside it, so the img rendered
   at its natural dimensions — and a photograph off a phone is around 3000px
   across. It escaped the box, the dialog and the page, which read as the
   settings screen being drawn over.

   A fixed circle that crops rather than scales: a portrait and a landscape
   snapshot both need to end up as the same round thumbnail, and object-fit is
   what makes a face fill it instead of sitting in a letterboxed strip. */
.avatar-preview{position:relative;width:88px;height:88px;flex:0 0 auto;
  display:grid;place-items:center;overflow:hidden;border-radius:999px;
  background:var(--gray-100);border:1px solid var(--border);color:var(--text-quaternary)}
/* Taken out of the grid rather than sized inside it. As a grid item under
   place-items:center the image does not stretch, so height:100% had nothing to
   resolve against and it fell back to its own 3:4 aspect — filling the width
   and overshooting the height. Absolute against the circle removes the
   question. */
.avatar-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.avatar-preview svg{width:28px;height:28px}

.avatar-pick{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.avatar-pick p{margin:7px 0 0}

.acct-photo{display:flex;align-items:center;gap:16px;margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.acct-photo .avatar-preview{width:64px;height:64px}
.acct-photo .avatar-preview svg{width:22px;height:22px}
.acct-photo p{margin:7px 0 0}

/* The student page header. A title and a line, not a greeting. */
.sh{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:0 0 20px}
.sh h1{margin:0;font-size:25px;line-height:1.15;font-weight:680;letter-spacing:-.04em}
.sh p{margin:5px 0 0;color:var(--text-tertiary);font-size:13.5px}
.sh-class{flex:0 0 auto;padding:6px 11px;border:1px solid var(--border);border-radius:999px;background:var(--surface);
  color:var(--text-secondary);font-size:11px;font-weight:620;white-space:nowrap}
.win-note{margin:0 0 16px;padding:9px 13px;border-left:2px solid var(--border-strong);
  color:var(--text-tertiary);font-size:12px;line-height:1.55}
.win-note strong{color:var(--text-secondary);font-weight:650}
@media (max-width:760px){
  .sh{flex-direction:column;gap:10px;margin-bottom:16px}
  .sh h1{font-size:22px}
  .sh-class{white-space:normal}
}
.closed-note{display:grid;gap:5px;padding:15px 16px;border-radius:var(--radius-md);
  border:1px solid var(--error-100);background:var(--error-50)}
.closed-note.is-in{border-color:var(--brand-200);background:var(--brand-25)}
.closed-note strong{font-size:14px;font-weight:670;color:var(--error-700)}
.closed-note.is-in strong{color:var(--brand-800)}
.closed-note span{color:var(--text-secondary);font-size:13px;line-height:1.55}
.dl-choice{display:grid;gap:8px}
.dl-opt{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid var(--border);
  border-radius:var(--radius-md);background:var(--surface);cursor:pointer}
.dl-opt:has(input:checked){border-color:var(--brand-400);background:var(--brand-25);box-shadow:0 0 0 3px rgba(80,175,55,.10)}
.dl-opt input{width:auto;margin:2px 0 0;flex:0 0 auto;box-shadow:none}
.dl-opt span{display:grid;gap:2px;color:var(--text-tertiary);font-size:12px;line-height:1.5}
.dl-opt strong{color:var(--text);font-size:13px;font-weight:660}

/* Course cover photo. The preview carries the same 16:9 the card uses, so what
   is chosen here is what appears on the courses grid. */
.cover-field{display:grid;gap:10px}
.cover-preview{aspect-ratio:16/9;border-radius:var(--radius-md);border:1px solid var(--border);
  background:linear-gradient(135deg,var(--brand-500),var(--brand-700));background-size:cover;background-position:center}
.cover-preview.has-image{border-color:var(--gray-300)}
.cover-zone{margin-top:0}
.fu-zone.is-busy{opacity:.6;pointer-events:none}
.cover-field .btn.small{justify-self:start}

/* Which classes a course belongs to. Dimmed rather than removed while it is
   open to everybody, so the choice underneath is still visible. */
.class-picker{display:grid;gap:8px;margin-top:10px;padding-left:2px}
.class-picker.is-off{opacity:.4;pointer-events:none}

/* Class setup. Sections rather than one long form, because the link, the board,
   the courses and the extra sittings are four unrelated decisions. */
.setup-block{padding:18px 0;border-top:1px solid var(--border)}
.setup-block:first-child{padding-top:0;border-top:0}
.setup-block h4{margin:0 0 12px;font-size:13px;font-weight:680;letter-spacing:-.01em}
.check-row.is-fixed{opacity:.65}

.session-list{display:grid;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.session-row{display:flex;align-items:center;gap:14px;padding:11px 13px;border:1px solid var(--border);
  border-radius:var(--radius-md);background:var(--bg-primary)}
.session-when{display:grid;gap:1px;min-width:130px}
.session-when strong{font-size:13px;font-weight:650}
.session-when span{color:var(--text-quaternary);font-size:11.5px}
.session-meta{flex:1;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  color:var(--text-tertiary);font-size:12.5px}
.session-actions{display:flex;gap:6px;flex:0 0 auto}
.session-row.is-cancelled .session-when,.session-row.is-cancelled .session-meta span:not(.pill){text-decoration:line-through}
.session-row.is-past{opacity:.6}

.session-form{display:grid;grid-template-columns:minmax(0,1.4fr) 90px minmax(0,1fr) minmax(0,1.2fr) auto;
  gap:10px;align-items:end}
.session-form .form-field{margin:0}

.data-table.compact td,.data-table.compact th{padding:9px 12px;font-size:12.5px}
.pct-cell{display:flex;align-items:center;gap:10px;min-width:150px}
.pct-cell .cc-bar{flex:1;margin-top:0}
.pct-cell b{font-size:11.5px;font-weight:700;color:var(--brand-700)}

@media (max-width:700px){
  .session-form{grid-template-columns:minmax(0,1fr)}
  .session-row{flex-wrap:wrap}
  .session-actions{width:100%}
}
.cc-who{color:var(--text-quaternary);font-size:11.5px;font-weight:600}

/* ---- Scheduled posts --------------------------------------------- */
/* A term is planned in months, so the queue is drawn as months rather than as a
   list of dates. A day with nothing on it is still drawn: the gaps are the
   point when you are looking for the week you forgot. */
.plan{display:grid;gap:22px}
.plan-month h4{margin:0 0 10px;font-size:13px;font-weight:680;letter-spacing:-.01em}
.plan-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;
  border:1px solid var(--border);border-radius:var(--radius-md);background:var(--border);overflow:hidden}
.plan-head{padding:7px 8px;background:var(--gray-50);color:var(--text-quaternary);
